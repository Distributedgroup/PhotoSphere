name: Deploy Validate User Service

on:
  push:
    branches:
      - dev
    paths:
      - 'UserDomain/ValidateCodeService/**'


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Forzar autenticación en Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORDAV }}" | docker login -u "${{ secrets.DOCKER_USERNAMEAV }}" --password-stdin || exit 1
          docker logout
          echo "${{ secrets.DOCKER_PASSWORDAV }}" | docker login -u "${{ secrets.DOCKER_USERNAMEAV }}" --password-stdin

      - name: Construir imagen Docker
        run: |
          cd UserDomain/ValidateUserService
          docker build -t alevm98/validatecodeservice:latest .
          docker images | grep validatecodeservice || echo "🚨 Imagen no encontrada localmente"

      - name: Subir imagen a Docker Hub
        run: | 
          docker push alevm98/validatecodeservice:latest
          echo "✅ Imagen subida a Docker Hub"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar sesión en Docker Hub en EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST_DNSAV }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEYAV }}
          script: |
            echo "🚀 Iniciando sesión en Docker Hub en EC2..."
            echo "${{ secrets.DOCKER_PASSWORDAV }}" | docker login -u "${{ secrets.DOCKER_USERNAMEAV }}" --password-stdin

      - name: Conectar a EC2 y actualizar contenedor
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST_DNSAV }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEYAV }}
          script: |
            echo "🛠 Verificando si Docker está instalado..."
            if ! command -v docker &> /dev/null
            then
                echo "⚠️ Docker no está instalado. Instalándolo..."
                sudo apt update -y
                sudo apt install -y docker.io
                sudo systemctl enable docker
                sudo systemctl start docker
            else
                echo "✅ Docker ya está instalado."
            fi

            echo "🔄 Eliminando imágenes antiguas..."
            docker stop validatecodeservice || echo "No existía un contenedor en ejecución"
            docker rm validatecodeservice || echo "No existía un contenedor previo"
            docker rmi alevm98/validatecodeservice:latest || echo "No había imagen previa para eliminar"

            echo "📥 Descargando nueva imagen desde Docker Hub..."
            docker pull alevm98/validatecodeservice:latest || { echo "🚨 Error al hacer pull de la imagen"; exit 1; }

            echo "🚀 Iniciando nuevo contenedor..."
            docker run -d --restart unless-stopped --name validatecodeservice -p 5053:5053 alevm98/validatecodeservice:latest

            echo "🔍 Verificando contenedores activos..."
            docker ps -a
