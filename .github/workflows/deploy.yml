name: Deploy Microservices

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Obtiene todo el historial

      - name: Fetch all history
        run: git fetch --all  # 🔥 Esto asegura que tenemos todo el historial para git diff


      - name: Detect changed microservices
        id: filter
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d HEAD^ HEAD | cut -d'/' -f2 | sort -u)
          SERVICES=""
          for dir in $CHANGED; do
            if [[ -f "UserDomain/$dir/Dockerfile" ]]; then
              SERVICES="$SERVICES UserDomain/$dir"
            fi
          done
          echo "Detected changes in: $SERVICES"
          echo "services=$SERVICES" >> $GITHUB_OUTPUT


  deploy:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.services != '' }}
    strategy:
        matrix:
          service: ${{ fromJSON(needs.detect-changes.outputs.services) }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

            # 🔹 Agregar este paso antes de construir la imagen
      - name: Debug Changed Services
        run: echo "Services to deploy:${{ needs.detect-changes.outputs.services }}"

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          cd UserDomain/${{ matrix.service }}  # ✅ Agregar 'UserDomain/'
          IMAGE_NAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:latest


      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets[format('EC2_HOST_{0}', matrix.service)] }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          ssh -o StrictHostKeyChecking=no -i private_key.pem $USER@$HOST << 'EOF'
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            docker stop ${{ matrix.service }} || true
            docker rm ${{ matrix.service }} || true
            docker run -d --name ${{ matrix.service }} -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            docker system prune -f
          EOF
