name: Deploy CreateUserService

on:
  push:
    branches:
      - main
    paths:
      - '**'  # Se activará cuando haya cambios en cualquier archivo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v3

      - name: Login en DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Construir imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/createuserservice:latest .
      
      - name: Subir imagen a DockerHub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/createuserservice:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Conectar a EC2 y actualizar el servicio
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/createuserservice:latest
            docker stop createuserservice || true
            docker rm createuserservice || true
            docker run -d --name createuserservice -p 3000:3000 --restart always ${{ secrets.DOCKERHUB_USERNAME }}/createuserservice:latest
