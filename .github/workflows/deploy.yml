name: CI/CD for Microservices

on:
  push:
    branches:
      - dev
    paths:
      - 'domain1/microservice1/**'
      - 'domain1/microservice2/**'
      - 'domain2/microservice3/**'
      - 'domain2/microservice4/**'
      - 'domain3/microservice5/**'
      - 'domain3/microservice6/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [
          { name: 'microservice1', path: 'domain1/microservice1', ec2_host: '${{ secrets.EC2_HOST_1 }}' },
          { name: 'microservice2', path: 'domain1/microservice2', ec2_host: '${{ secrets.EC2_HOST_2 }}' },
          { name: 'microservice3', path: 'domain2/microservice3', ec2_host: '${{ secrets.EC2_HOST_3 }}' },
          { name: 'microservice4', path: 'domain2/microservice4', ec2_host: '${{ secrets.EC2_HOST_4 }}' },
          { name: 'microservice5', path: 'domain3/microservice5', ec2_host: '${{ secrets.EC2_HOST_5 }}' },
          { name: 'microservice6', path: 'domain3/microservice6', ec2_host: '${{ secrets.EC2_HOST_6 }}' }
        ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changes
        id: check_changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "${{ matrix.service.path }}"; then
            echo "CHANGED=true" >> $GITHUB_ENV
          else
            echo "CHANGED=false" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        if: env.CHANGED == 'true'
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest ${{ matrix.service.path }}
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest

      - name: Deploy to EC2
        if: env.CHANGED == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ matrix.service.ec2_host }} << 'EOF'
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest
            docker stop ${{ matrix.service.name }} || true
            docker rm ${{ matrix.service.name }} || true
            docker run -d --name ${{ matrix.service.name }} -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest
          EOF
