name: CI/CD Pipeline - Microservices

on:
  push:
    branches:
      - dev
    paths:
      - '**/Dockerfile'  # Solo se ejecuta cuando se modifica un Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [PostDomain, StoryDomain, UserDomain]
        service: 
          - CreatePostService
          - UpdatePostService
          - DeletePostService
          - CreateStoryService
          - UpdateStoryService
          - DeleteStoryService
          - CreateUserService
          - UpdateUserService
          - ResetPasswordService
          - ValidateUserService
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          cd ${{ matrix.domain }}/${{ matrix.service }}
          docker build -t fernanyag20/${{ matrix.service }} .

      - name: Push Docker image to DockerHub
        run: |
          docker push fernanyag20/${{ matrix.service }}:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [PostDomain, StoryDomain, UserDomain]
        service: 
          - CreatePostService
          - UpdatePostService
          - DeletePostService
          - CreateStoryService
          - UpdateStoryService
          - DeleteStoryService
          - CreateUserService
          - UpdateUserService
          - ResetPasswordService
          - ValidateUserService
    steps:
      - name: Trigger redeploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull fernanyag20/${{ matrix.service }}:latest
            docker stop ${{ matrix.service }} || true
            docker rm ${{ matrix.service }} || true
            docker run -d --name ${{ matrix.service }} --restart always -p 80:80 -e JWT_SECRET_KEY="claveSegura123@" fernanyag20/${{ matrix.service }}:latest
            echo "Desplegado ${{ matrix.service }} en ${{ secrets.HOST_DNS }}"
