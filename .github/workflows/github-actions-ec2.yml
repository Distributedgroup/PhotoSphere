
name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 🔥 Importante para que git diff funcione correctamente

      - name: Get changed files
        id: filter
        run: |
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          
          echo "🔍 Archivos modificados detectados:"
          echo "$changed_files"

          services=$(echo "$changed_files" | awk -F'/' '{print $1}' | sort -u | uniq)

          echo "📌 Microservicios detectados para reconstrucción: $services"

          if [[ -z "$services" ]]; then
            echo "⚠ No hay microservicios modificados."
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            echo "services=$(echo \"$services\" | jq -R -s -c 'split(\"\n\") | map(select(length > 0))')" >> $GITHUB_OUTPUT
          fi



  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}  # Solo se ejecuta si hay cambios
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          if [[ -z "${{ matrix.service }}" ]]; then
            echo "Error: SERVICE is empty. Skipping build."
            exit 1
          fi
          SERVICE=${{ matrix.service }}
          IMAGE_NAME="fernanyag20/${SERVICE,,}"  # Nombre de imagen en DockerHub
          
          echo "Building Docker image for $SERVICE..."
          docker build -t $IMAGE_NAME:latest $SERVICE  # Construcción de la imagen
          
          echo "Pushing Docker image to DockerHub..."
          docker push $IMAGE_NAME:latest  # Subida a DockerHub

  deploy-to-ec2:
    needs: build-and-push
    if: ${{ needs.detect-changes.outputs.services != '[]' }}  # Solo se ejecuta si hay cambios
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Trigger redeploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [[ -z "${{ matrix.service }}" ]]; then
              echo "Error: SERVICE is empty. Skipping deployment."
              exit 1
            fi
            SERVICE=${{ matrix.service }}
            IMAGE_NAME="fernanyag20/${SERVICE,,}"

            docker pull $IMAGE_NAME:latest
            docker stop $SERVICE || true
            docker rm $SERVICE || true
            docker run -d --name $SERVICE --restart always -p 80:80 -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" $IMAGE_NAME:latest
            
            echo "Desplegado $SERVICE en ${{ secrets.HOST_DNS }}"
