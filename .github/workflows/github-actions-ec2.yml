
name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 🔥 Asegura que git diff funcione correctamente

      - name: Get changed files
        id: filter
        run: |
          changed_files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          
          echo "🔍 Archivos modificados detectados:"
          echo "$changed_files"

          services=$(echo "$changed_files" | awk -F'/' '{print $1 "/" $2}' | sort -u | uniq)

          echo "📌 Microservicios detectados para reconstrucción: $services"

          if [[ -z "$services" ]]; then
            echo "⚠ No hay microservicios modificados. Se devolverá un JSON vacío."
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            json_output=$(echo "$services" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "services=$json_output" >> $GITHUB_OUTPUT
          fi

          # 🔍 Depuración: Imprimir la salida
          echo "🔄 Valor final de services: $(cat $GITHUB_OUTPUT)"



  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          if [[ -z "${{ matrix.service }}" ]]; then
            echo "Error: SERVICE is empty. Skipping build."
            exit 1
          fi
          
          SERVICE=${{ matrix.service }}
          IMAGE_NAME="fernanyag20/$(basename ${SERVICE,,})"  # 🔥 Asegurar que el nombre es en minúsculas
          
          echo "📌 Building Docker image for $SERVICE..."
          
          # 🔥 Determinar el path del microservicio
          BUILD_PATH="$SERVICE"

          if [[ ! -f "$BUILD_PATH/Dockerfile" ]]; then
            echo "❌ ERROR: Dockerfile not found in $BUILD_PATH/"
            exit 1
          fi
          
          docker build -t $IMAGE_NAME:latest $BUILD_PATH
          
          echo "🚀 Pushing Docker image to DockerHub..."
          docker push $IMAGE_NAME:latest


  deploy-to-ec2:
    needs: build-and-push
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '""' && needs.detect-changes.outputs.services != null }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Debug services output
        run: |
          echo "🚨 Valor recibido en deploy-to-ec2: '${{ needs.detect-changes.outputs.services }}'"


      - name: Connect to EC2 and deploy service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            SERVICE=${{ matrix.service }}
            IMAGE_NAME="fernanyag20/$(basename ${SERVICE,,})"

            echo "📌 Deploying $SERVICE on EC2..."
            docker pull $IMAGE_NAME:latest
            docker stop $SERVICE || true
            docker rm $SERVICE || true
            docker run -d --name $SERVICE --restart always -p 80:80 $IMAGE_NAME:latest
            echo "✅ Successfully deployed $SERVICE on EC2"


