name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed-folder: ${{ steps.filter.outputs.changed }}
      services: ${{ steps.filter.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Detect changed microservice
        id: filter
        run: |
          SERVICES="[]"

          for SERVICE in $(ls -d */ | sed 's#/##'); do
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^$SERVICE/"; then
              case "$SERVICE" in
                "CreateUserService") IP="${{ secrets.EC2_CREATE_USER_IP }}" ;;
                "LoginUserService") IP="${{ secrets.EC2_LOGIN_USER_IP }}" ;;
                "GetUsersService") IP="${{ secrets.EC2_GET_USERS_IP }}" ;;
                "UpdateUserService") IP="${{ secrets.EC2_UPDATE_USER_IP }}" ;;
                *) IP="none" ;;
              esac

              if [[ "$IP" != "none" ]]; then
                SERVICES=$(echo $SERVICES | jq --arg srv "$SERVICE" --arg ip "$IP" '. + [{"service": $srv, "host": $ip}]')
              fi
            fi
          done

          if [ "$SERVICES" = "[]" ]; then
            SERVICES='[{"service": "none", "host": "none"}]'
          fi

          echo "::set-output name=services::$SERVICES"

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services && needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          SERVICE=${{ matrix.service.service }}
          IMAGE_NAME="fernanyag20/$(basename ${SERVICE,,})"
          
          echo "📌 Building Docker image for $SERVICE..."
          docker build -t $IMAGE_NAME:latest $SERVICE
          echo "🚀 Pushing Docker image to DockerHub..."
          docker push $IMAGE_NAME:latest

  deploy-to-ec2:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services && needs.detect-changes.outputs.services != '[{"service": "none", "host": "none"}]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Debug services output
        run: |
          echo "🚨 Deploying for services: '${{ needs.detect-changes.outputs.services }}'"

      - name: Connect to EC2 and deploy service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.service.host }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            SERVICE=${{ matrix.service.service }}
            IMAGE_NAME="fernanyag20/$(basename ${SERVICE,,})"

            if [[ "$SERVICE" == "none" ]]; then
              echo "❌ No valid service to deploy. Exiting."
              exit 1
            fi

            echo "📌 Deploying $SERVICE on EC2 (${matrix.service.host})..."
            docker pull $IMAGE_NAME:latest
            docker stop $SERVICE || true
            docker rm $SERVICE || true
            docker run -d --name $SERVICE --restart always -p 80:80 $IMAGE_NAME:latest
            echo "✅ Successfully deployed $SERVICE on EC2 (${matrix.service.host})"

