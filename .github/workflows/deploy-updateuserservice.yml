name: Deploy UpdateUserService

on:
  push:
    paths:
      - 'UserDomain/UpdateUserService/**'  # Solo detecta cambios en esta carpeta
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Iniciar sesión en Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Construir imagen Docker
      run: |
        cd UserDomain/UpdateUserService
        docker build -t fernanyag20/updateuserservice:latest .

    - name: Subir imagen a Docker Hub
      run: docker push fernanyag20/updateuserservice:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Conectar a EC2 y actualizar contenedor
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST_UPDATEUSERSERVICE }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull fernanyag20/updateuserservice:latest
          docker stop updateuserservice || true
          docker rm udpateuserservice || true
          docker run -d --name updateuserservice -p 5051:5051 fernanyag20/updateuserservice:latest
